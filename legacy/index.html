    <script>
      // Safeguard against iframe/sandbox scripts attempting to overwrite read-only window.fetch
      (function() {
        try {
          var currentFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Fallback if window is frozen
        }
      })();
